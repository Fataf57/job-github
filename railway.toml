# Config Railway à la racine du monorepo (sans Root Directory dans le dashboard).
[build]
builder = "NIXPACKS"
buildCommand = "bash django-backend/build.sh"

[deploy]
startCommand = "cd django-backend && gunicorn job_api.wsgi:application --bind 0.0.0.0:$PORT"
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
